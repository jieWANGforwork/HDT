project:
  name: HDT

runtime:
  device: auto
  seed: 777

data:
  dataset: reddit
  objective: novelty
  root: data/processed/reddit
  item_metadata: item_data.csv
  expected_train: train_test/train_session_df_replay_buffer_nov1_user.df

model:
  mode: inter_only
  item_num: null
  state_size: 20
  hidden_size: 100
  embed_dim: 100
  n_layer: 1
  n_head: 1
  activation_function: relu
  dropout: 0.1

training:
  batch_size: 200
  epochs: 70
  max_steps: 0
  lr: 0.001
  discount: 0.5
  checkpoint_dir: checkpoints/reddit
  loss_weights:
    supervised: 1.0
    user: 1.0
    reward: 0.0

evaluation:
  top_k: 10
