project:
  name: HDT

runtime:
  device: auto
  seed: 777

data:
  dataset: xing
  objective: novelty
  root: data/processed/xing
  item_metadata: item_data.csv
  expected_train: train_session_df_replay_buffer_nov.df
  expected_test: test_session_df_replay_buffer.df

model:
  mode: single_objective
  item_num: null
  state_size: 20
  hidden_size: 100
  embed_dim: 100
  n_layer: 1
  n_head: 1
  activation_function: relu
  dropout: 0.1
  action_embedding_source: states

training:
  batch_size: 200
  epochs: 70
  max_steps: 0
  lr: 0.01
  discount: 0.5
  checkpoint_dir: checkpoints/xing
  loss_weights:
    supervised: 1.0
    user: 1.0
    session: 0.5
    diversity: 0.0
    reward: 0.0

evaluation:
  top_k: 10
